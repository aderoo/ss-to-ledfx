[project]
name = "ss-to-ledfx"
version = "0.1.0"
description = "Bridge SoundSwitch Art-Net DMX to LedFx scenes and brightness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
]

[project.scripts]
ss-to-ledfx = "ss_to_ledfx.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ss_to_ledfx"]

[tool.setuptools.package-data]
ss_to_ledfx = ["web/*.html"]
